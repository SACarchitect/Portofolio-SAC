<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC · Symbiotic Architecture Consultant</title>
<meta name="description" content="SAC, Symbiotic Architecture Consultant. Architecture and interior design with interactive 3D models.">
<meta property="og:type" content="website">
<meta property="og:title" content="SAC · Symbiotic Architecture Consultant">
<meta property="og:description" content="Architecture and interior design, presented as interactive 3D models.">

<style>
:root{--bg:#fff;--ink:#111;--mute:#777;--line:#e8e8e8;--ph:#f2f2f2;--ph2:#e7e7e7;--panel:rgba(255,255,255,.88);--accent:#ff945d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo img{height:30px;width:auto;display:block}
.top{transition:transform .4s ease}.top.hide{transform:translateY(-100%)}
.top nav{display:flex;gap:24px;font-size:14px}
.top nav a{color:var(--mute)}.top nav a:hover{color:var(--ink)}
main{min-height:70vh}
.rows{padding:8px 28px 40px}
.row{display:block;padding:40px 0 48px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .img{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--ph),var(--ph2))}
.row .img.ph{aspect-ratio:21/8}
.row .img img{position:absolute;left:0;top:-10%;width:100%;height:120%;object-fit:cover;will-change:transform}
.row .no{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--mute);letter-spacing:.1em}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:18px}
.row h3{margin:0;font-size:clamp(24px,3.2vw,38px);font-weight:600;letter-spacing:-.01em}
.meta2{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);color:var(--ink);padding:3px 7px;margin-right:10px}
.herop{aspect-ratio:16/9;overflow:hidden}.herop img{width:100%;height:100%;object-fit:cover;display:block}
.shot{padding:0 28px 64px}.shot img{display:block;width:100%;max-width:760px;margin:0 auto}
.idx{padding:28px 28px 56px;border-top:1px solid var(--line)}
.idx h2{margin:0 0 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.ir{display:grid;grid-template-columns:48px 1fr 1fr 64px;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line);font-size:17px}
.ir .n,.ir .l,.ir .y{font-size:13px;color:var(--mute)}.ir .y{text-align:right}
a.ir:hover .t{text-decoration:underline}
.cta{display:inline-block;font-size:14px;letter-spacing:.03em;background:var(--ink);color:var(--bg);padding:13px 20px}
.vviews{position:absolute;left:12px;top:12px;z-index:6;display:none;flex-wrap:wrap;gap:2px;padding:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);max-width:calc(100% - 24px)}
.vviews button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;padding:7px 10px;cursor:pointer}
.vviews button:hover{background:var(--line)}
/* animasi scroll */
.rv{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
html.anim .rv{opacity:0;transform:translateY(42px)}
html.anim .rv.in{opacity:1;transform:none}
html.anim .row .img{clip-path:inset(14% 7% 14% 7%);transition:clip-path 1.2s cubic-bezier(.2,.7,.2,1)}
html.anim .row.in .img{clip-path:inset(0)}
html.anim .row .cap{opacity:0;transform:translateY(24px);transition:opacity .9s .25s ease,transform .9s .25s ease}
html.anim .row.in .cap{opacity:1;transform:none}
.about{padding:72px 28px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:28px}
.about h2,.sec{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.about p{margin:0;font-size:clamp(20px,2.6vw,30px);line-height:1.35;max-width:820px}
.viewer{position:relative;width:100%;height:76vh;min-height:420px;background:linear-gradient(180deg,var(--ph),var(--ph2));overflow:hidden}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.vload,.vgate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vload{background:var(--bg);z-index:5;transition:opacity .5s}
.vt{font-size:13px;color:var(--mute)}
.track{width:200px;height:3px;background:var(--line);overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.vgate{display:none;z-index:4;background:transparent}
.gate{font:inherit;font-size:14px;letter-spacing:.04em;color:var(--bg);background:var(--ink);border:0;padding:14px 22px;cursor:pointer}
.vbar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:6;display:none;gap:2px;padding:5px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);max-width:calc(100% - 20px);overflow-x:auto}
.vbar button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:9px 11px;cursor:pointer;white-space:nowrap}
.vbar button:hover{background:var(--line)}.vbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero-ph{aspect-ratio:16/8;min-height:300px;background:linear-gradient(135deg,var(--ph),var(--ph2));display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.pinfo{display:grid;grid-template-columns:1fr 2fr;gap:28px;padding:36px 28px 64px}
.pinfo h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px);line-height:1.1;font-weight:600}
.meta{margin:0;padding:0;list-style:none;font-size:14px;color:var(--mute);line-height:1.8}
.pinfo p{margin:0 0 24px;font-size:18px;line-height:1.5;max-width:720px}
.nav2{display:flex;gap:24px;font-size:14px}.nav2 a{border-bottom:1px solid var(--ink)}
footer{border-top:1px solid var(--line);padding:40px 28px 56px;display:grid;grid-template-columns:1fr 2fr;gap:28px;font-size:15px;line-height:1.8}
footer a{border-bottom:1px solid var(--line)}footer a:hover{border-color:var(--ink)}
@media (max-width:720px){.top{padding:14px 18px}.idx{padding:24px 18px 40px}.ir{grid-template-columns:34px 1fr 48px;font-size:16px}.ir .l{display:none}.rows{padding:4px 18px 24px}.row{padding:28px 0 34px}.row .img{aspect-ratio:4/3}.row .img.ph{aspect-ratio:16/9}.cap{flex-direction:column;gap:6px}.meta2{text-align:left}.about,.pinfo,footer{grid-template-columns:1fr;padding-left:18px;padding-right:18px}.viewer{height:68vh}}
</style>
</head>

<script>

var PROJECTS=[

  {slug:'living-world-bali',title:'Our Studio Living World',location:'Bali, Indonesia',year:'',type:'',cover:'cover-our-studio.jpg',pos:'50% 64%',model:'living-world-bali.glb.gz',
   text:'Explore the whole scene in 3D. Drag to orbit, pinch or scroll to zoom, and use the view buttons to jump to a ready-made angle.'},
  {title:'Deijo Florist'},
  {title:'FISIP Store UB'},
  {title:'F House'},
  {title:'As-Safar Mosque'},
  // === Daftar proyek 2026 dan 2025. Hapus satu proyek = hapus satu baris utuh di bawah ini ===

  {title:'Jasa Tirta DHC',location:'',year:'2026'},
  {title:'Noto Arena',location:'',year:'2026'},
  {title:'Sabilillah Language Lab',location:'',year:'2026'},
  {title:'Our Studio',location:'',year:'2026'},
  {title:'Our Studio 2',location:'',year:'2026'},

  {title:'Our Studio 5',location:'',year:'2026'},
  {title:'Our Studio 6',location:'Batam',year:'2026'},
  {title:'PJT Room',location:'',year:'2026'},
  {title:'Laundry Rizki',location:'',year:'2026'},
  {title:'Our Studio 7',location:'Pasaraya',year:'2026'},
  {title:'Sabilillah Museum',location:'',year:'2026'},
  {title:'SnappySnap',location:'Malang',year:'2026'},
  {title:'Camat Kokop Update',location:'',year:'2026'},
  {title:'Eco Edupark SMP Sabilillah',location:'',year:'2026'},
  {title:'Wisma and Warehouse, Jasa Tirta',location:'',year:'2025'},
  {title:'Bauhaus Interior',location:'',year:'2025'},
  {title:'Jasa Tirta 2',location:'',year:'2025'},

];
/* ====================================== */
(function(){var seen={};PROJECTS.forEach(function(p,i){if(!p.slug){var q=p.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');p.slug=seen[q]?q+'-'+(i+1):q;seen[q]=1}else seen[p.slug]=1})})();

var app=document.getElementById('app'),destroyViewer=null;
function two(n){return (n<10?'0':'')+n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function ctaUrl(){return CONFIG.whatsapp?'https://wa.me/'+CONFIG.whatsapp:(CONFIG.email?'mailto:'+CONFIG.email:'')}
function ctaHtml(){var u=ctaUrl();return u?'<p style="margin:0 0 28px"><a class="cta" href="'+esc(u)+'" target="_blank" rel="noopener">Start a project</a></p>':''}
(function(){var h='',L=document.getElementById('links');
  if(CONFIG.email)h+='<div><a href="mailto:'+esc(CONFIG.email)+'">'+esc(CONFIG.email)+'</a></div>';
  if(CONFIG.whatsapp)h+='<div><a href="https://wa.me/'+esc(CONFIG.whatsapp)+'" target="_blank" rel="noopener">WhatsApp '+esc(CONFIG.whatsappLabel||'')+'</a></div>';
  if(CONFIG.instagram)h+='<div><a href="https://instagram.com/'+esc(CONFIG.instagram)+'" target="_blank" rel="noopener">Instagram @'+esc(CONFIG.instagram)+'</a></div>';
  L.innerHTML=h||'<div style="color:var(--mute)">SAC</div>';})();

function home(){
  document.title='SAC · Symbiotic Architecture Consultant';
  var h='<div class="rows">',more='';
  PROJECTS.forEach(function(p,i){
    if(p.cover){
      h+='<a class="row" href="#/p/'+p.slug+'"><div class="img"><img data-par loading="lazy" src="'+esc(p.cover)+'" alt="'+esc(p.title)+'" style="object-position:'+esc(p.pos||'50% 50%')+'"></div>'+
        '<div class="cap"><h3>'+esc(p.title)+'</h3><div class="meta2">'+(p.model?'<span class="tag">Interactive 3D</span>':'')+esc(p.location||'')+'</div></div></a>';
    }else{
      var inner='<span class="n">'+two(i+1)+'</span><span class="t">'+esc(p.title)+'</span><span class="l">'+esc(p.location||'')+'</span><span class="y">'+esc(p.year||'')+'</span>';
      more+=(p.model?'<a class="ir rv" href="#/p/'+p.slug+'">':'<div class="ir rv">')+inner+(p.model?'</a>':'</div>');
    }
  });
  h+='</div>'+(more?'<section class="idx"><h2 class="rv">More projects</h2>'+more+'</section>':'')+'<section class="about" id="about"><h2 class="rv">About</h2><p class="rv">'+esc(CONFIG.about)+'</p></section>';
  app.innerHTML=h;
}

function project(i){
  var p=PROJECTS[i],next=PROJECTS[(i+1)%PROJECTS.length];
  document.title=p.title+' · SAC';
  var meta='';[['Location',p.location],['Year',p.year],['Type',p.type]].forEach(function(m){if(m[1])meta+='<li>'+m[0]+': '+esc(m[1])+'</li>'});
  var top=p.model?'<div class="viewer rv" id="v"></div>':(p.cover?'<div class="herop rv"><img src="'+esc(p.cover)+'" alt="'+esc(p.title)+'" style="object-position:'+esc(p.pos||'50% 50%')+'"></div>':'<div class="hero-ph rv">Images coming soon</div>');
  app.innerHTML=top+
   '<div class="pinfo"><div class="rv"><h1>'+esc(p.title)+'</h1><ul class="meta">'+meta+'</ul></div><div class="rv">'+(p.text?'<p>'+esc(p.text)+'</p>':'')+ctaHtml()+'<div class="nav2"><a href="#/">All projects</a><a href="#/p/'+next.slug+'">Next: '+esc(next.title)+'</a></div></div></div>'+
   (p.model&&p.cover?'<div class="shot rv"><img loading="lazy" src="'+esc(p.cover)+'" alt="'+esc(p.title)+'"></div>':'');
  if(p.model)destroyViewer=mountViewer(document.getElementById('v'),p.model);
}

/* animasi saat scroll */
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),io=null,par=[],ticking=false,lastY=0;
if(!reduce)document.documentElement.classList.add('anim');
function setupAnim(){
  var els=[].slice.call(document.querySelectorAll('.rv,.row'));
  par=[].slice.call(document.querySelectorAll('[data-par]'));
  if(io)io.disconnect();
  if(reduce||!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  els.forEach(function(e){io.observe(e)});
  frame();
}
function frame(){
  ticking=false;
  var vh=window.innerHeight;
  par.forEach(function(el){
    var r=el.parentNode.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)return;
    var p=(vh/2-(r.top+r.height/2))/(vh/2+r.height/2);
    el.style.transform='translate3d(0,'+(-p*r.height*0.08).toFixed(1)+'px,0)';
  });
}
var topbar=document.querySelector('.top');
window.addEventListener('scroll',function(){
  var y=window.pageYOffset;
  topbar.classList.toggle('hide',y>140&&y>lastY);lastY=y;
  if(!reduce&&par.length&&!ticking){ticking=true;requestAnimationFrame(frame)}
},{passive:true});

function route(){
  if(destroyViewer){destroyViewer();destroyViewer=null}
  var h=location.hash,m=h.match(/^#\/p\/([^\/]+)/),idx=-1;
  if(m)PROJECTS.forEach(function(p,i){if(p.slug===m[1])idx=i});
  if(idx>=0){project(idx);window.scrollTo(0,0)}
  else{home();var t=(h==='#about'||h==='#contact')?document.getElementById(h.slice(1)):null;if(t)t.scrollIntoView();else window.scrollTo(0,0)}
  topbar.classList.remove('hide');setupAnim();
}
window.addEventListener('hashchange',route);route();

/* ============ 3D viewer ============ */
var libsP;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadLibs(){
  if(libsP)return libsP;
  var L=['https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js','https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'];
  libsP=L.reduce(function(p,u){return p.then(function(){return loadScript(u)})},Promise.resolve()).catch(function(e){libsP=null;throw e});
  return libsP;
}
function mountViewer(box,url){
  var dead=false,renderer=null,ro=null,scene=null;
  box.innerHTML='<div class="vload"><div class="vt">Loading 3D model…</div><div class="track"><div class="fill"></div></div></div>'+
   '<div class="vgate"><button class="gate">Explore in 3D</button></div>'+
   '<div class="vviews"></div><div class="vbar"><button data-a="rot" aria-pressed="false">Auto-rotate</button><button data-a="night" aria-pressed="false">Night</button><button data-a="reset">Reset</button><button data-a="lock">Lock</button><button data-a="fs">Fullscreen</button></div>';
  var load=box.querySelector('.vload'),vt=box.querySelector('.vt'),fill=box.querySelector('.fill'),gate=box.querySelector('.vgate'),vv=box.querySelector('.vviews'),bar=box.querySelector('.vbar');
  function fail(){vt.textContent='The 3D model could not be loaded.';fill.style.background='#b3261e'}
  loadLibs().then(function(){
    if(dead)return;
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    box.insertBefore(renderer.domElement,box.firstChild);
    scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(45,1,1,10000);
    var hemi=new THREE.HemisphereLight(0xffffff,0x8a8576,1.0),sun=new THREE.DirectionalLight(0xfff2dc,0.9);
    scene.add(hemi);scene.add(sun);
    var controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.dampingFactor=0.08;controls.autoRotateSpeed=0.6;
    var home={pos:new THREE.Vector3(),target:new THREE.Vector3()},night=false,fly=null;
    function flyTo(a){var from=camera.position.clone(),to=new THREE.Vector3(a[0],a[1],a[2]),t0=performance.now();fly=function(){var k=Math.min(1,(performance.now()-t0)/800),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(from,to,e);controls.target.copy(home.target);if(k>=1)fly=null}}
    function setActive(a){controls.enabled=a;renderer.domElement.style.touchAction=a?'none':'pan-y';gate.style.display=a?'none':'flex';bar.style.display='flex'}
    function resize(){var w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(box)}else window.addEventListener('resize',resize);
    resize();
    function ok(g){
      if(dead)return;
      scene.add(g.scene);
      var b=new THREE.Box3().setFromObject(g.scene),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z);
      camera.near=r/500;camera.far=r*30;camera.updateProjectionMatrix();
      home.target.copy(c);home.pos.set(c.x+r*0.75,c.y+r*0.55,c.z+r*0.75);
      camera.position.copy(home.pos);controls.target.copy(c);
      controls.minDistance=r*0.05;controls.maxDistance=r*4;controls.maxPolarAngle=Math.PI*0.495;
      sun.position.set(c.x+r,c.y+r*1.4,c.z+r*0.6);controls.update();
      var V={Corner:[c.x+r*.75,c.y+r*.55,c.z+r*.75],Front:[c.x,c.y+r*.22,c.z+r*.95],Side:[c.x+r*.95,c.y+r*.22,c.z],Aerial:[c.x+r*.35,c.y+r*1.0,c.z+r*.55],Plan:[c.x,c.y+r*1.25,c.z+r*.001]};
      vv.innerHTML=Object.keys(V).map(function(k){return '<button data-v="'+k+'">'+k+'</button>'}).join('');
      vv.onclick=function(e){var b=e.target.closest('button');if(b)flyTo(V[b.getAttribute('data-v')])};
      vv.style.display='flex';
      setActive(false);load.style.opacity=0;setTimeout(function(){load.style.display='none'},500);
    }
    box.querySelector('.gate').onclick=function(){setActive(true)};
    bar.onclick=function(e){
      var t=e.target.closest('button');if(!t)return;var a=t.getAttribute('data-a');
      if(a==='rot'){controls.autoRotate=!controls.autoRotate;t.setAttribute('aria-pressed',controls.autoRotate)}
      else if(a==='night'){night=!night;t.setAttribute('aria-pressed',night);t.textContent=night?'Day':'Night';
        renderer.setClearColor(night?0x0d1018:0x000000,night?1:0);hemi.intensity=night?0.35:1.0;sun.intensity=night?0.25:0.9;sun.color.setHex(night?0x8fa6d9:0xfff2dc)}
      else if(a==='reset'){camera.position.copy(home.pos);controls.target.copy(home.target);controls.update()}
      else if(a==='lock'){setActive(false)}
      else if(a==='fs'){var d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var f=box.requestFullscreen||box.webkitRequestFullscreen;if(f)f.call(box);setActive(true)}}
    };
    renderer.setAnimationLoop(function(){if(fly)fly();controls.update();renderer.render(scene,camera)});
    var x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';
    x.onprogress=function(e){if(e.lengthComputable)fill.style.width=(e.loaded/e.total*70)+'%'};
    x.onerror=fail;
    x.onload=function(){
      if(dead)return;if(x.status>=400){fail();return}
      try{
        var buf=x.response,u8=new Uint8Array(buf);
        if(u8[0]===0x1f&&u8[1]===0x8b){var o=pako.ungzip(u8);buf=o.buffer.slice(o.byteOffset,o.byteOffset+o.byteLength)}
        fill.style.width='85%';vt.textContent='Preparing the scene…';
        setTimeout(function(){if(!dead)new THREE.GLTFLoader().parse(buf,'',ok,fail)},30);
      }catch(e){fail()}
    };
    x.send();
  }).catch(fail);
  return function(){
    dead=true;if(ro)ro.disconnect();
    if(scene)scene.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(function(m){for(var k in m){if(m[k]&&m[k].isTexture)m[k].dispose()}m.dispose()})}});
    if(renderer){renderer.setAnimationLoop(null);renderer.dispose()}
  };
}
