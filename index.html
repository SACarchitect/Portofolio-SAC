<!DOCTYPE html>
<html lang="en" class="intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC · Symbiotic Architecture Consultant</title>
<meta name="description" content="SAC, Symbiotic Architecture Consultant. Architecture and interior design with interactive 3D models.">
<meta property="og:type" content="website">
<meta property="og:title" content="SAC · Symbiotic Architecture Consultant">
<meta property="og:description" content="Architecture and interior design, presented as interactive 3D models.">
<meta property="og:image" content="https://sacarchitect.github.io/Portofolio-SAC/og-image.jpg">
<meta property="og:url" content="https://sacarchitect.github.io/Portofolio-SAC/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sacarchitect.github.io/Portofolio-SAC/og-image.jpg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="logo-sac-mark.png">
<style>
:root{--bg:#fff;--ink:#111;--mute:#8a8a8a;--line:#ececec;--ph:#f3f3f3;--panel:rgba(255,255,255,.9);--accent:#ff945d;--col:540px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.up{text-transform:uppercase;letter-spacing:.06em}

/* ===== Intro: logo di tengah lalu mengecil ke pojok kiri ===== */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:background-color .6s ease .7s;cursor:pointer}
#intro .ilogo{width:min(300px,56vw);height:auto;display:block;transform-origin:0 0;opacity:0;animation:ilIn .7s ease forwards}
#intro .itag{font-size:11px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);opacity:0;animation:ilIn .7s ease .25s forwards;transition:opacity .3s}
#intro.go{background-color:transparent;pointer-events:none}
#intro.go .itag{opacity:0!important;animation:none}
@keyframes ilIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html.intro .top .logo{visibility:hidden}
html.intro main,html.intro footer,html.intro .top nav,html.intro .top .tools{opacity:0}
main,footer,.top nav,.top .tools{transition:opacity .8s ease .5s}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px 24px;background:var(--bg);transition:transform .4s ease}
.top.hide{transform:translateY(-100%)}
.logo img{height:20px;width:auto;display:block}
.top nav{display:flex;gap:34px;font-size:11px}
.top nav a{color:var(--mute);transition:color .2s}
.top nav a:hover,.top nav a.on{color:var(--ink)}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:22px;font-size:11px}
.tools a{color:var(--mute)}.tools a:hover{color:var(--ink)}
.search{display:flex;align-items:center;gap:6px;color:var(--mute)}
.search input{border:0;outline:0;background:transparent;width:96px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);padding:2px 0;border-bottom:1px solid transparent}
.search input:focus{border-bottom-color:var(--line)}
.search input::placeholder{color:var(--mute)}

/* ===== Daftar proyek (gaya kolom tengah) ===== */
main{min-height:70vh}
.feed{padding:28px 24px 40px}
.item{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;margin:0 0 16px}
.item .lbl{text-align:right;padding-top:2px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:500;letter-spacing:0}
.item .t{font-size:12px;font-weight:500;line-height:1.3;max-width:200px}
.item .l{font-size:10px;color:var(--mute);margin-top:-5px}
.item .img{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--ph)}
.item .img img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;opacity:0;transition:opacity .6s ease,scale .8s cubic-bezier(.2,.7,.2,1);will-change:translate}
.item .img img.ok{opacity:1}
.item:hover .img img{scale:1.025}
.item .lbl{will-change:translate}
.item .img .tag3d{position:absolute;left:8px;top:8px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);padding:3px 6px}
.item .img::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.4s linear infinite}
.item .img:has(img.ok)::before,.item .img.none::before{display:none}
.item .img.none{display:flex;align-items:center;justify-content:center}
.soon{font-size:10px;color:var(--mute);transition:color .2s}
.item:hover .soon{color:var(--ink)}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}

/* Proyek tanpa foto: daftar teks di kolom yang sama */
.index{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;padding:12px 24px 64px}
.index h2{grid-column:2;margin:0 0 10px;font-size:10px;font-weight:400;color:var(--mute)}
.index .rows{grid-column:2}
.ir{display:grid;grid-template-columns:28px 1fr auto 44px;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.ir .n,.ir .lc,.ir .y{font-size:10px;color:var(--mute)}
.ir .y{text-align:right}
a.ir:hover .tt{text-decoration:underline}
.empty{grid-column:2;color:var(--mute);font-size:11px;padding:24px 0}

/* About + footer */
.about{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;padding:56px 24px 72px;border-top:1px solid var(--line)}
.about h2{margin:0;text-align:right;font-size:10px;font-weight:400;color:var(--mute)}
.about p{margin:0;font-size:17px;font-weight:300;line-height:1.55}
.about.aboutpg{border-top:0;padding-top:40px;min-height:60vh}
.tools a.on{color:var(--ink)}
/* biodata */
.prof{display:grid;grid-template-columns:180px 1fr;gap:24px;margin-top:48px;padding-top:40px;border-top:1px solid var(--line)}
.prof img{display:block;width:100%;height:auto}
.prof h3{margin:0;font-size:20px;font-weight:400}
.prof .pm{font-size:11px;color:var(--mute);line-height:1.6;margin:6px 0 16px;letter-spacing:.02em}
.about .prof p{font-size:13px;line-height:1.65;color:#444;margin:0 0 12px}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.cv .ch{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.ci{font-size:12px;line-height:1.55;margin-bottom:16px;color:#444}
.ci{display:flex;flex-direction:column}
.ci b{font-weight:500;color:var(--ink)}.ci i{font-style:normal;order:1}.ci span{order:2;color:var(--mute);font-size:11px}
footer{display:grid;grid-template-columns:1fr;justify-items:center;text-align:center;padding:40px 24px 56px;border-top:1px solid var(--line);font-size:12px;line-height:1.9}
footer .h{text-align:center;font-size:10px;color:var(--mute);margin-bottom:8px}
footer a{color:var(--ink);border-bottom:1px solid var(--line)}footer a:hover{border-color:var(--ink)}
footer .fl{display:block;width:140px;margin:22px auto 0}
.pg .body p.ctap{max-width:none;margin:0}

/* ===== Halaman proyek ===== */
.pg{display:grid;grid-template-columns:1fr minmax(0,820px) 1fr;column-gap:32px;padding:28px 24px 64px}
.pg .side{grid-column:1;justify-self:end;max-width:200px}.pg .body{grid-column:2}
.herop img{margin:0 auto}
.pg .body>.rv:last-child{text-align:center}.nav2{justify-content:center}
.pg .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;position:sticky;top:72px;align-self:start}
.pg .side .t{font-size:17px;font-weight:400;line-height:1.25;margin:6px 0 0}
.pg .side .loc{font-size:11px;color:var(--mute)}
.pg .side .yr{font-size:11px;color:var(--mute);margin-top:18px}
.info{margin:10px 0 0;font-size:10px;line-height:1.35}
.info dt{color:var(--mute);margin-top:12px}
.info dd{margin:2px 0 0}
/* foto membesar saat halaman detail dibuka */
.herop img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 100px);animation:grow .9s cubic-bezier(.2,.7,.2,1)}
.pg .side,.pg .body>:not(.viewer-wrap){animation:fadeUp .7s ease .45s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(.92);transform-origin:0 0}to{opacity:1;transform:none}}
.meta{margin:0;padding:0;list-style:none;font-size:10px;color:var(--mute);line-height:1.8}
.pg .body{min-width:0}
.pg .body p{margin:22px 0 22px;font-size:15px;font-weight:300;line-height:1.6;max-width:620px}
.hero-ph{aspect-ratio:3/2;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:10px}
/* deskripsi dua bahasa */
.desc{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:36px 0 44px}
.desc .lg{font-size:10px;letter-spacing:.08em;color:var(--mute);margin-bottom:8px}
.pg .body .desc p{margin:0;font-size:14px;line-height:1.65;max-width:none}
.desc .id p{color:#555}
/* galeri: 1 foto besar + 4 kecil */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.gal>div{overflow:hidden;cursor:zoom-in;background:var(--ph)}
.gal>div:first-child{grid-row:span 2}
.gal img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:4/5;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.gal>div:hover img{transform:scale(1.03)}
/* galeri 2 atau 4 foto: 2 kolom */
.gal.g2,.gal.g4{grid-template-columns:1fr 1fr}.gal.g2>div:first-child,.gal.g4>div:first-child{grid-row:auto;grid-column:auto}
.gal.g2>div:first-child img,.gal.g4>div:first-child img{position:static;aspect-ratio:4/5}
/* galeri 6 foto: 3 kolom x 2 baris (HP: 2 kolom) */
.gal.g6{grid-template-columns:repeat(3,1fr)}.gal.g8{grid-template-columns:repeat(4,1fr)}
.gal.g6>div,.gal.g8>div{grid-row:auto!important;grid-column:auto!important}
.gal.g6>div:first-child img,.gal.g8>div:first-child img{position:static;aspect-ratio:4/5}
/* galeri 13 foto: 4 kolom, foto pertama besar 2x2 */
.gal.g13{grid-template-columns:repeat(4,1fr)}.gal.g13>div{grid-row:auto!important;grid-column:auto!important}
.gal.g13>div:first-child{grid-column:span 2!important;grid-row:span 2!important;position:relative}
.gal.g13>div:first-child img{position:absolute;inset:0;aspect-ratio:auto}
@media(max-width:760px){.gal.g6,.gal.g8,.gal.g13{grid-template-columns:1fr 1fr}
  .gal.g13>div:first-child{grid-row:auto!important;position:static}.gal.g13>div:first-child img{position:static;aspect-ratio:4/5}}
/* gambar teknik (aksonometri dll), lebar penuh tanpa terpotong */
.drw{margin-top:12px}.drw img{display:block;width:100%;height:auto}
/* foto ke-6 dst: berpasangan, dua kolom sama lebar */
.gal>div:nth-child(n+6):nth-child(even){grid-column:1}.gal>div:nth-child(n+6):nth-child(odd){grid-column:2/-1}
@media(min-width:761px){.gal>div:first-child img{aspect-ratio:auto;position:absolute;inset:0}.gal>div:first-child{position:relative}}
/* foto diperbesar */
#lb{position:fixed;inset:0;z-index:60;display:none;cursor:zoom-out;overflow:hidden;touch-action:pan-y}
#lb.on{display:block}
#lb .bg{position:absolute;inset:0;background:rgba(255,255,255,.97)}
#lb .ls{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;will-change:transform}
#lb img{max-width:92vw;max-height:90vh;display:block;user-select:none;-webkit-user-drag:none;will-change:transform}
#lb button{z-index:2;position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;font-family:inherit;font-size:34px;font-weight:300;line-height:1;padding:16px;cursor:pointer;color:var(--ink)}
#lb .pv{left:8px}#lb .nx{right:8px}
.v3{margin-top:12px}
.vgo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
@media(max-width:760px){.desc{grid-template-columns:1fr;gap:20px}.gal{grid-template-columns:1fr 1fr}.gal>div:first-child{grid-column:1/-1;grid-row:auto}.gal>div:nth-child(n+6){grid-column:auto!important}}
.shot img{display:block;width:100%;height:auto}
.shot{margin-top:40px;max-width:var(--col)}
.cta{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:11px 16px}
.nav2{display:flex;gap:20px;margin-top:28px;font-size:11px}.nav2 a{color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.nav2 a:hover{color:var(--ink)}

/* ===== 3D viewer ===== */
.viewer{position:relative;width:100%;aspect-ratio:3/2;max-height:72vh;min-height:320px;background:linear-gradient(180deg,#f4f4f4,#e9e9e9);overflow:hidden}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.vload,.vgate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vload{background:var(--bg);z-index:5;transition:opacity .5s}
.vt{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.track{width:160px;height:2px;background:var(--line);overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.vgate{display:none;z-index:4;background:transparent}
.gate{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--ink);border:0;padding:11px 16px;cursor:pointer}
.vviews,.vbar{position:absolute;z-index:6;display:none;gap:2px;padding:3px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.vviews{left:10px;top:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.vbar{left:50%;transform:translateX(-50%);bottom:10px;max-width:calc(100% - 20px);overflow-x:auto}
.vviews button,.vbar button{font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:0;padding:6px 8px;cursor:pointer;white-space:nowrap}
.vviews button:hover,.vbar button:hover{background:var(--line)}
.vbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* animasi muncul saat scroll */
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
html.anim .rv{opacity:0;transform:translateY(18px)}
html.anim .rv.in{opacity:1;transform:none}

/* ===== HP ===== */
@media (max-width:760px){
  /* header HP: baris 1 logo | About Contact, baris 2 tahun | search */
  .top{grid-template-columns:auto 1fr auto auto;padding:14px 16px 12px;column-gap:18px;row-gap:14px}
  .tools{display:contents}
  .tools>a{grid-row:1}.tools>a:nth-of-type(1){grid-column:3}.tools>a:nth-of-type(2){grid-column:4}
  .top nav{grid-column:1/3;grid-row:2;gap:22px;overflow-x:auto}
  .search{grid-column:3/5;grid-row:2;justify-self:end}.search input{width:64px}
  .feed{padding:12px 16px 24px}
  .item,.index,.about,footer,.pg{grid-template-columns:1fr;padding-left:16px;padding-right:16px}
  .feed .item{padding:0}
  .item{margin-bottom:28px}
  .item .lbl{order:2;text-align:left;align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:4px 10px;padding-top:10px}
  .item .l{margin-top:0;width:100%}
  .index h2,.index .rows,.empty{grid-column:1}
  .ir{grid-template-columns:24px 1fr 40px}.ir .lc{display:none}
  .about h2{text-align:left;margin-bottom:12px}
  /* About HP: gaya editorial */
  .about.aboutpg{padding-top:20px}
  .about p{font-size:15px;line-height:1.6}
  /* foto kiri, teks kanan seperti di laptop */
  .prof{grid-template-columns:36% 1fr;gap:14px;margin-top:32px;padding-top:28px}
  .prof img{width:100%}
  .prof h3{font-size:17px}
  .prof .pm{font-size:10px;margin:4px 0 12px}
  .about .prof p{font-size:12px;line-height:1.6;margin-bottom:10px}
  .cv{grid-template-columns:1fr;gap:0;margin-top:12px}
  .cv>div{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
  .ci{display:grid;grid-template-columns:1fr auto;column-gap:12px;margin-bottom:14px}
  .ci b{grid-column:1}.ci span{grid-column:2;grid-row:1;text-align:right;white-space:nowrap}
  .ci i{grid-column:1/-1;color:#666}
  /* halaman proyek HP: foto dulu, lalu judul & info rata kiri */
  .pg{padding-top:8px}
  .pg .body{display:contents}
  .pg .body>*{order:3;grid-column:1;min-width:0}
  .pg .viewer-wrap{order:1}
  .pg .side{order:2;grid-column:1;justify-self:stretch;max-width:none;position:static;text-align:left;
    flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:18px 0 0}
  .pg .side .t{width:100%;font-size:20px;margin:4px 0 2px}
  .pg .side .yr{margin-top:0}
  .info{width:100%;display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px}
  .info dt,.info dd{margin:0}
  .desc{margin:28px 0 32px}
}
@media (prefers-reduced-motion:reduce){.item .img::before{animation:none}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><img class="ilogo" src="logo-sac-mark.png" alt=""><div class="itag">Symbiotic Architecture Consultant</div></div>
<header class="top">
  <a class="logo" href="#/" aria-label="SAC home"><img src="logo-sac-mark.png" alt="SAC"></a>
  <nav class="up" id="cats"></nav>
  <div class="tools up">
    <label class="search"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 8l3 3" stroke="currentColor" stroke-width="1.2"/></svg><input id="q" type="search" placeholder="Search" aria-label="Search projects"></label>
    <a href="#about">About</a><a href="#contact">Contact</a>
  </div>
</header>
<main id="app"></main>
<footer id="contact"><div class="h up">Contact</div><div><div id="links"></div><img class="fl" src="logo-sac.png" alt="SAC · Symbiotic Architecture Consultant"></div></footer>
<script>
/* ============ EDIT DI SINI ============ */
// Kontak: isi yang mau ditampilkan, kosongkan yang tidak dipakai.
var CONFIG={
  email:'sacstudioarchitecture@gmail.com',
  whatsapp:'6285128055217',            // nomor tanpa + dan spasi (untuk link wa.me)
  whatsappLabel:'+62 851-2805-5217',   // teks yang ditampilkan
  instagram:'sacarchitect',            // username tanpa @
  about:'SAC, Symbiotic Architecture Consultant, is an architecture and interior design practice from Indonesia. We design buildings and spaces, and present them as interactive 3D models you can explore on any phone or browser.'
};
// Daftar proyek. Tambah proyek baru = tambah satu baris di sini.
// Tiap proyek ditulis SATU BARIS. Isian: title, location, year, cover (nama file foto),
// pos (bagian foto yang tampil, '50% 50%' = tengah), model (file 3D .glb atau .glb.gz), text (deskripsi)
var PROJECTS=[
  // Semua proyek bisa diklik. Tambahkan cover:'nama-foto.jpg' untuk foto, model:'file.glb.gz' untuk 3D interaktif.
  // Info di kiri halaman detail: client, architect, size, status (kosongkan kalau tidak dipakai)
  {title:'Cafe Kopi Pojok',location:'Malang',year:'2026',cover:'cover-kopi-pojok.webp',pos:'50% 52%',
   client:'Mr. AML',architect:'Rohid Riza Nabhan S.Ars',size:'200',status:'Proposal',
   text_en:'Kopi Pojok is a 200 m² neighbourhood coffee house in Malang built around a love of vinyl. A sand-toned textured facade with a corrugated canopy, glass block walls and a planted forecourt gives the cafe a calm presence on the street. Inside, a walnut record wall with arched niches and speakers anchors the room under a sage-green coffered ceiling, while paper lanterns, terracotta and green upholstery and folding glass doors that open to the terrace make it a warm place to linger.',
   text_id:'Kopi Pojok adalah kedai kopi lingkungan seluas 200 m² di Malang yang dirancang dari kecintaan pada piringan hitam. Fasad bertekstur warna pasir dengan kanopi gelombang, dinding glass block, dan halaman depan bertanaman memberi kesan tenang dari arah jalan. Di dalam, dinding rak vinyl dari kayu walnut dengan relung lengkung dan speaker menjadi pusat ruang di bawah plafon coffered hijau sage, sementara lampu lampion kertas, jok terakota dan hijau, serta pintu kaca lipat yang terbuka ke teras membuatnya nyaman untuk berlama-lama.',

/* ===== Intro: logo di tengah, lalu mengecil ke pojok kiri atas ===== */
(function(){
  var root=document.documentElement,intro=document.getElementById('intro'),il=intro.querySelector('.ilogo'),target=document.querySelector('.top .logo img'),done=false;
  function finish(){if(done)return;done=true;root.classList.remove('intro');intro.remove()}
  if(reduce){finish();return}
  function shrink(){
    if(done||intro.classList.contains('go'))return;
    var a=il.getBoundingClientRect(),b=target.getBoundingClientRect();
    if(!a.width||!b.width){finish();return}
    intro.classList.add('go');
    il.style.animation='none';il.style.opacity=1;
    // Logo bergerak dan mengecil menuju pojok kiri atas
    var dur=1200,end='translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+(b.width/a.width)+')';
    if(il.animate)il.animate([{transform:'translate(0,0) scale(1)'},{transform:end}],{duration:dur,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'});
    else il.style.transform=end;
    setTimeout(function(){root.classList.remove('intro')},dur*0.5);
    target.style.visibility='hidden';
    setTimeout(function(){target.style.visibility='';finish()},dur+50);
  }
  function start(){setTimeout(shrink,1300)}
  if(il.complete&&il.naturalWidth)start();else{il.onload=start;il.onerror=finish}
  intro.addEventListener('click',shrink);
  setTimeout(shrink,4000); // pengaman kalau logo lambat dimuat
})();

      vv.onclick=function(e){var b=e.target.closest('button');if(b)flyTo(V[b.getAttribute('data-v')])};
      setActive(true);load.style.opacity=0;setTimeout(function(){load.style.display='none'},500);
    }
    box.querySelector('.gate').onclick=function(){setActive(true)};
    bar.onclick=function(e){
      var t=e.target.closest('button');if(!t)return;var a=t.getAttribute('data-a');
      if(a==='rot'){controls.autoRotate=!controls.autoRotate;t.setAttribute('aria-pressed',controls.autoRotate)}
      else if(a==='night'){night=!night;t.setAttribute('aria-pressed',night);t.textContent=night?'Lights off':'Lights on';
        renderer.setClearColor(night?0x0d1018:0x000000,night?1:0);hemi.intensity=night?0.12:0.35;sun.intensity=night?0.05:1.6;
        mats.forEach(function(m){m.envMapIntensity=night?0.12:1});sun.color.setHex(night?0x8fa6d9:0xfff2dc);
        bulbs.forEach(function(l){l.intensity=night?1.6:0});
        glow.forEach(function(m){if(m.emissive){m.emissive.setHex(night?0xffd29a:m.userData.e0);m.emissiveIntensity=night?1.2:1}})}
      else if(a==='reset'){camera.position.copy(home.pos);controls.target.copy(home.target);controls.update()}
      else if(a==='lock'){setActive(false)}
      else if(a==='fs'){var d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var f=box.requestFullscreen||box.webkitRequestFullscreen;if(f)f.call(box);setActive(true)}}
    };
    renderer.setAnimationLoop(function(){if(fly)fly();controls.update();renderer.render(scene,camera)});
    var x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';
    x.onprogress=function(e){if(e.lengthComputable)fill.style.width=(e.loaded/e.total*70)+'%'};
    x.onerror=fail;
    x.onload=function(){
      if(dead)return;if(x.status>=400){fail();return}
      try{
        var buf=x.response,u8=new Uint8Array(buf);
        if(u8[0]===0x1f&&u8[1]===0x8b){var o=pako.ungzip(u8);buf=o.buffer.slice(o.byteOffset,o.byteOffset+o.byteLength)}
        fill.style.width='85%';vt.textContent='Preparing the scene…';
        setTimeout(function(){if(!dead)new THREE.GLTFLoader().parse(buf,'',ok,fail)},30);
      }catch(e){fail()}
    };
    x.send();
  }).catch(fail);
  return function(){
    dead=true;if(ro)ro.disconnect();
    if(scene)scene.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(function(m){for(var k in m){if(m[k]&&m[k].isTexture)m[k].dispose()}m.dispose()})}});
    if(renderer){renderer.setAnimationLoop(null);renderer.dispose()}
  };
}
</script>
</body>
</html>
