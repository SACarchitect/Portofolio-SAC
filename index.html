<!DOCTYPE html>
<html lang="en" class="intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC · Symbiotic Architecture Consultant</title>
<meta name="description" content="SAC, Symbiotic Architecture Consultant. Architecture and interior design with interactive 3D models.">
<meta property="og:type" content="website">
<meta property="og:title" content="SAC · Symbiotic Architecture Consultant">
<meta property="og:description" content="Architecture and interior design, presented as interactive 3D models.">
<meta property="og:image" content="https://sacarchitect.github.io/Portofolio-SAC/og-image.jpg">
<meta property="og:url" content="https://sacarchitect.github.io/Portofolio-SAC/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sacarchitect.github.io/Portofolio-SAC/og-image.jpg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="logo-sac-mark.png">
<style>
:root{--bg:#fff;--ink:#111;--mute:#8a8a8a;--line:#ececec;--ph:#f3f3f3;--panel:rgba(255,255,255,.9);--accent:#ff945d;--col:540px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.up{text-transform:uppercase;letter-spacing:.06em}

/* ===== Intro: logo di tengah lalu mengecil ke pojok kiri ===== */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:background-color .6s ease .7s;cursor:pointer}
#intro .ilogo{width:min(300px,56vw);height:auto;display:block;transform-origin:0 0;opacity:0;animation:ilIn .7s ease forwards}
#intro .itag{font-size:11px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);opacity:0;animation:ilIn .7s ease .25s forwards;transition:opacity .3s}
#intro.go{background-color:transparent;pointer-events:none}
#intro.go .itag{opacity:0!important;animation:none}
@keyframes ilIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html.intro .top .logo{visibility:hidden}
html.intro main,html.intro footer,html.intro .top nav,html.intro .top .tools{opacity:0}
main,footer,.top nav,.top .tools{transition:opacity .8s ease .5s}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px 24px;background:var(--bg);transition:transform .4s ease}
.top.hide{transform:translateY(-100%)}
.logo img{height:20px;width:auto;display:block}
.top nav{display:flex;gap:34px;font-size:11px}
.top nav a{color:var(--mute);transition:color .2s}
.top nav a:hover,.top nav a.on{color:var(--ink)}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:22px;font-size:11px}
.tools a{color:var(--mute)}.tools a:hover{color:var(--ink)}
.search{display:flex;align-items:center;gap:6px;color:var(--mute)}
.search input{border:0;outline:0;background:transparent;width:96px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);padding:2px 0;border-bottom:1px solid transparent}
.search input:focus{border-bottom-color:var(--line)}
.search input::placeholder{color:var(--mute)}

/* ===== Daftar proyek (gaya kolom tengah) ===== */
main{min-height:70vh}
.feed{padding:28px 24px 40px}
.item{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;margin:0 0 16px}
.item .lbl{text-align:right;padding-top:2px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:500;letter-spacing:0}
.item .t{font-size:12px;font-weight:500;line-height:1.3;max-width:200px}
.item .l{font-size:10px;color:var(--mute);margin-top:-5px}
.item .img{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--ph)}
.item .img img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;opacity:0;transition:opacity .6s ease,scale .8s cubic-bezier(.2,.7,.2,1);will-change:translate}
.item .img img.ok{opacity:1}
.item:hover .img img{scale:1.025}
.item .lbl{will-change:translate}
.item .img .tag3d{position:absolute;left:8px;top:8px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);padding:3px 6px}
.item .img::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.4s linear infinite}
.item .img:has(img.ok)::before,.item .img.none::before{display:none}
.item .img.none{display:flex;align-items:center;justify-content:center}
.soon{font-size:10px;color:var(--mute);transition:color .2s}
.item:hover .soon{color:var(--ink)}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}

/* Proyek tanpa foto: daftar teks di kolom yang sama */
.index{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;padding:12px 24px 64px}
.index h2{grid-column:2;margin:0 0 10px;font-size:10px;font-weight:400;color:var(--mute)}
.index .rows{grid-column:2}
.ir{display:grid;grid-template-columns:28px 1fr auto 44px;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.ir .n,.ir .lc,.ir .y{font-size:10px;color:var(--mute)}
.ir .y{text-align:right}
a.ir:hover .tt{text-decoration:underline}
.empty{grid-column:2;color:var(--mute);font-size:11px;padding:24px 0}

/* About + footer */
.about{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;padding:56px 24px 72px;border-top:1px solid var(--line)}
.about h2{margin:0;text-align:right;font-size:10px;font-weight:400;color:var(--mute)}
.about p{margin:0;font-size:17px;font-weight:300;line-height:1.55}
footer{display:grid;grid-template-columns:1fr minmax(0,var(--col)) 1fr;column-gap:16px;padding:40px 24px 56px;border-top:1px solid var(--line);font-size:12px;line-height:1.9}
footer .h{text-align:right;font-size:10px;color:var(--mute)}
footer a{color:var(--ink);border-bottom:1px solid var(--line)}footer a:hover{border-color:var(--ink)}
footer .fl{display:block;width:140px;margin-top:22px}

/* ===== Halaman proyek ===== */
.pg{display:grid;grid-template-columns:1fr minmax(0,820px) 1fr;column-gap:32px;padding:28px 24px 64px}
.pg .side{grid-column:1;justify-self:end;max-width:200px}.pg .body{grid-column:2}
.herop img{margin:0 auto}
.pg .body>.rv:last-child{text-align:center}.nav2{justify-content:center}
.pg .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;position:sticky;top:72px;align-self:start}
.pg .side .t{font-size:17px;font-weight:400;line-height:1.25;margin:6px 0 0}
.pg .side .loc{font-size:11px;color:var(--mute)}
.pg .side .yr{font-size:11px;color:var(--mute);margin-top:18px}
.info{margin:10px 0 0;font-size:10px;line-height:1.35}
.info dt{color:var(--mute);margin-top:12px}
.info dd{margin:2px 0 0}
/* foto membesar saat halaman detail dibuka */
.herop img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 100px);animation:grow .9s cubic-bezier(.2,.7,.2,1)}
.pg .side,.pg .body>:not(.viewer-wrap){animation:fadeUp .7s ease .45s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(.92);transform-origin:0 0}to{opacity:1;transform:none}}
.meta{margin:0;padding:0;list-style:none;font-size:10px;color:var(--mute);line-height:1.8}
.pg .body{min-width:0}
.pg .body p{margin:22px 0 22px;font-size:15px;font-weight:300;line-height:1.6;max-width:620px}
.hero-ph{aspect-ratio:3/2;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:10px}
/* deskripsi dua bahasa */
.desc{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:36px 0 44px}
.desc .lg{font-size:10px;letter-spacing:.08em;color:var(--mute);margin-bottom:8px}
.pg .body .desc p{margin:0;font-size:14px;line-height:1.65;max-width:none}
.desc .id p{color:#555}
/* galeri: 1 foto besar + 4 kecil */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.gal>div{overflow:hidden;cursor:zoom-in;background:var(--ph)}
.gal>div:first-child{grid-row:span 2}
.gal img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:4/5;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.gal>div:hover img{transform:scale(1.03)}
@media(min-width:761px){.gal>div:first-child img{aspect-ratio:auto;position:absolute;inset:0}.gal>div:first-child{position:relative}}
/* foto diperbesar */
#lb{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.96);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:90vh;display:block}
#lb button{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;font-family:inherit;font-size:34px;font-weight:300;line-height:1;padding:16px;cursor:pointer;color:var(--ink)}
#lb .pv{left:8px}#lb .nx{right:8px}
.v3{margin-top:12px}
.vgo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
@media(max-width:760px){.desc{grid-template-columns:1fr;gap:20px}.gal{grid-template-columns:1fr 1fr}.gal>div:first-child{grid-column:1/-1;grid-row:auto}}
.shot img{display:block;width:100%;height:auto}
.shot{margin-top:40px;max-width:var(--col)}
.cta{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:11px 16px}
.nav2{display:flex;gap:20px;margin-top:28px;font-size:11px}.nav2 a{color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.nav2 a:hover{color:var(--ink)}

/* ===== 3D viewer ===== */
.viewer{position:relative;width:100%;aspect-ratio:3/2;max-height:72vh;min-height:320px;background:linear-gradient(180deg,#f4f4f4,#e9e9e9);overflow:hidden}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.vload,.vgate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vload{background:var(--bg);z-index:5;transition:opacity .5s}
.vt{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.track{width:160px;height:2px;background:var(--line);overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.vgate{display:none;z-index:4;background:transparent}
.gate{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--ink);border:0;padding:11px 16px;cursor:pointer}
.vviews,.vbar{position:absolute;z-index:6;display:none;gap:2px;padding:3px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.vviews{left:10px;top:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.vbar{left:50%;transform:translateX(-50%);bottom:10px;max-width:calc(100% - 20px);overflow-x:auto}
.vviews button,.vbar button{font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:0;padding:6px 8px;cursor:pointer;white-space:nowrap}
.vviews button:hover,.vbar button:hover{background:var(--line)}
.vbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* animasi muncul saat scroll */
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
html.anim .rv{opacity:0;transform:translateY(18px)}
html.anim .rv.in{opacity:1;transform:none}

/* ===== HP ===== */
@media (max-width:760px){
  /* header HP: baris 1 logo | About Contact, baris 2 tahun | search */
  .top{grid-template-columns:auto 1fr auto auto;padding:14px 16px 12px;column-gap:18px;row-gap:14px}
  .tools{display:contents}
  .tools>a{grid-row:1}.tools>a:nth-of-type(1){grid-column:3}.tools>a:nth-of-type(2){grid-column:4}
  .top nav{grid-column:1/3;grid-row:2;gap:22px;overflow-x:auto}
  .search{grid-column:3/5;grid-row:2;justify-self:end}.search input{width:64px}
  .feed{padding:12px 16px 24px}
  .item,.index,.about,footer,.pg{grid-template-columns:1fr;padding-left:16px;padding-right:16px}
  .feed .item{padding:0}
  .item{margin-bottom:28px}
  .item .lbl{order:2;text-align:left;align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:4px 10px;padding-top:10px}
  .item .l{margin-top:0;width:100%}
  .index h2,.index .rows,.empty{grid-column:1}
  .ir{grid-template-columns:24px 1fr 40px}.ir .lc{display:none}
  .about h2,footer .h{text-align:left;margin-bottom:12px}
  /* halaman proyek HP: foto dulu, lalu judul & info rata kiri */
  .pg{padding-top:8px}
  .pg .body{display:contents}
  .pg .body>*{order:3;grid-column:1;min-width:0}
  .pg .viewer-wrap{order:1}
  .pg .side{order:2;grid-column:1;justify-self:stretch;max-width:none;position:static;text-align:left;
    flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:18px 0 0}
  .pg .side .t{width:100%;font-size:20px;margin:4px 0 2px}
  .pg .side .yr{margin-top:0}
  .info{width:100%;display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px}
  .info dt,.info dd{margin:0}
  .desc{margin:28px 0 32px}
}
@media (prefers-reduced-motion:reduce){.item .img::before{animation:none}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><img class="ilogo" src="logo-sac-mark.png" alt=""><div class="itag">Symbiotic Architecture Consultant</div></div>
<header class="top">
  <a class="logo" href="#/" aria-label="SAC home"><img src="logo-sac-mark.png" alt="SAC"></a>
  <nav class="up" id="cats"></nav>
  <div class="tools up">
    <label class="search"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 8l3 3" stroke="currentColor" stroke-width="1.2"/></svg><input id="q" type="search" placeholder="Search" aria-label="Search projects"></label>
    <a href="#about">About</a><a href="#contact">Contact</a>
  </div>
</header>
<main id="app"></main>
<footer id="contact"><div class="h up">Contact</div><div><div id="links"></div><img class="fl" src="logo-sac.png" alt="SAC · Symbiotic Architecture Consultant"></div></footer>
<script>
/* ============ EDIT DI SINI ============ */
// Kontak: isi yang mau ditampilkan, kosongkan yang tidak dipakai.
var CONFIG={
  email:'sacstudioarchitecture@gmail.com',
  whatsapp:'6285128055217',            // nomor tanpa + dan spasi (untuk link wa.me)
  whatsappLabel:'+62 851-2805-5217',   // teks yang ditampilkan
  instagram:'sacarchitect',            // username tanpa @
  about:'SAC, Symbiotic Architecture Consultant, is an architecture and interior design practice from Indonesia. We design buildings and spaces, and present them as interactive 3D models you can explore on any phone or browser.'
};
// Daftar proyek. Tambah proyek baru = tambah satu baris di sini.
// Tiap proyek ditulis SATU BARIS. Isian: title, location, year, cover (nama file foto),
// pos (bagian foto yang tampil, '50% 50%' = tengah), model (file 3D .glb atau .glb.gz), text (deskripsi)
var PROJECTS=[
  // Semua proyek bisa diklik. Tambahkan cover:'nama-foto.jpg' untuk foto, model:'file.glb.gz' untuk 3D interaktif.
  // Info di kiri halaman detail: client, architect, size, status (kosongkan kalau tidak dipakai)
  {title:'Cafe Kopi Pojok',location:'Malang',year:'2026',cover:'cover-pojok-kopi.jpg',pos:'50% 55%',
   client:'-',architect:'Rohid Riza Nabhan S.Ars',size:'200',status:'Proposal'},
  {title:'OUR Studio Lubuklinggau',location:'Lubuklinggau',year:'2026',cover:'cover-our-studio-lubuklinggau.webp',pos:'50% 60%',model:'our-studio-lubuklinggau.glb.gz',
   text_en:'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
   text_id:'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia.',
   gallery:['our-studio-1.webp','our-studio-2.webp','our-studio-3.webp','our-studio-4.webp','our-studio-5.webp'],
   client:'OUR Studio',architect:'Rohid Riza Nabhan S.Ars',size:'80',status:'Build'},
  {title:'Deijo Florist',location:'Bangkalan, Madura',year:'2025',cover:'cover-deijo-florist.webp',pos:'50% 72%',
   client:'Ibu Aida P.',architect:'Rohid Riza Nabhan S.Ars',size:'125',status:'Build'},
  {title:'FISIP Store',location:'Brawijaya University',year:'2025',cover:'cover-fisip-store.webp',pos:'50% 62%',
   client:'Brawijaya University',architect:'Rohid Riza Nabhan S.Ars',size:'75',status:'Proposal'},
  {title:'UB Merch Store',location:'Transmart Malang',year:'2025',cover:'cover-ub-merch-store.webp',pos:'50% 55%',
   client:'Brawijaya University',architect:'Rohid Riza Nabhan S.Ars',size:'65',status:'Build'},
  {title:'Nakamiki',location:'Transmart Malang',year:'2025',cover:'cover-nakamiki.webp',pos:'50% 58%',
   client:'Brawijaya University',architect:'Rohid Riza Nabhan S.Ars',size:'85',status:'Build'},
];
/* ====================================== */
(function(){var seen={};PROJECTS.forEach(function(p,i){if(!p.slug){var q=p.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');p.slug=seen[q]?q+'-'+(i+1):q;seen[q]=1}else seen[p.slug]=1})})();

var app=document.getElementById('app'),destroyViewer=null,qEl=document.getElementById('q'),catsEl=document.getElementById('cats');
function two(n){return (n<10?'0':'')+n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ===== Intro: logo di tengah, lalu mengecil ke pojok kiri atas ===== */
(function(){
  var root=document.documentElement,intro=document.getElementById('intro'),il=intro.querySelector('.ilogo'),target=document.querySelector('.top .logo img'),done=false;
  function finish(){if(done)return;done=true;root.classList.remove('intro');intro.remove()}
  if(reduce){finish();return}
  function shrink(){
    if(done||intro.classList.contains('go'))return;
    var a=il.getBoundingClientRect(),b=target.getBoundingClientRect();
    if(!a.width||!b.width){finish();return}
    intro.classList.add('go');
    il.style.animation='none';il.style.opacity=1;
    // Logo bergerak dan mengecil menuju pojok kiri atas
    var dur=1200,end='translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+(b.width/a.width)+')';
    if(il.animate)il.animate([{transform:'translate(0,0) scale(1)'},{transform:end}],{duration:dur,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'});
    else il.style.transform=end;
    setTimeout(function(){root.classList.remove('intro')},dur*0.5);
    target.style.visibility='hidden';
    setTimeout(function(){target.style.visibility='';finish()},dur+50);
  }
  function start(){setTimeout(shrink,1300)}
  if(il.complete&&il.naturalWidth)start();else{il.onload=start;il.onerror=finish}
  intro.addEventListener('click',shrink);
  setTimeout(shrink,4000); // pengaman kalau logo lambat dimuat
})();

/* ===== Kontak ===== */
function ctaUrl(){return CONFIG.whatsapp?'https://wa.me/'+CONFIG.whatsapp:(CONFIG.email?'mailto:'+CONFIG.email:'')}
function ctaHtml(){var u=ctaUrl();return u?'<p style="margin:0"><a class="cta" href="'+esc(u)+'" target="_blank" rel="noopener">Start a project</a></p>':''}
(function(){var h='',L=document.getElementById('links');
  if(CONFIG.email)h+='<div><a href="mailto:'+esc(CONFIG.email)+'">'+esc(CONFIG.email)+'</a></div>';
  if(CONFIG.whatsapp)h+='<div><a href="https://wa.me/'+esc(CONFIG.whatsapp)+'" target="_blank" rel="noopener">WhatsApp '+esc(CONFIG.whatsappLabel||'')+'</a></div>';
  if(CONFIG.instagram)h+='<div><a href="https://instagram.com/'+esc(CONFIG.instagram)+'" target="_blank" rel="noopener">Instagram @'+esc(CONFIG.instagram)+'</a></div>';
  L.innerHTML=h||'<div style="color:var(--mute)">SAC</div>';})();

/* ===== Menu kategori (berdasarkan tahun) ===== */
var YEARS=[];PROJECTS.forEach(function(p){if(p.year&&YEARS.indexOf(p.year)<0)YEARS.push(p.year)});YEARS.sort().reverse();
function catsHtml(cur){
  var h='<a href="#/"'+(!cur?' class="on"':'')+'>All</a>';
  YEARS.forEach(function(y){h+='<a href="#/y/'+y+'"'+(cur===y?' class="on"':'')+'>'+y+'</a>'});
  return h;
}

/* ===== Beranda ===== */
var curYear='';
function match(p){
  var q=(qEl.value||'').trim().toLowerCase();
  if(curYear&&p.year!==curYear)return false;
  return !q||(p.title+' '+(p.location||'')+' '+(p.year||'')).toLowerCase().indexOf(q)>=0;
}
function home(year){
  curYear=year||'';
  document.title='SAC · Symbiotic Architecture Consultant';
  catsEl.innerHTML=catsHtml(curYear);
  app.innerHTML='<div id="list"></div><section class="about" id="about"><h2 class="up rv">About</h2><p class="rv">'+esc(CONFIG.about)+'</p></section>';
  renderList();
}
function renderList(){
  var feed='',first=true;
  PROJECTS.forEach(function(p,i){
    if(!match(p))return;
    var no=two(i+1),pic;
    if(p.cover){
      var ld=first?'loading="eager" fetchpriority="high"':'loading="lazy"';first=false;
      pic='<img '+ld+' onload="this.classList.add(\'ok\')" src="'+esc(p.cover)+'" alt="'+esc(p.title)+'" style="object-position:'+esc(p.pos||'50% 50%')+'">';
    }else pic='<span class="soon up">Coming soon</span>';
    feed+='<a class="item rv" href="#/p/'+p.slug+'"><div class="lbl"><span class="badge">'+no+'</span><span class="t">'+esc(p.title)+'</span><span class="l up">'+esc([p.location,p.year].filter(Boolean).join(' · '))+'</span></div>'+
      '<div class="img'+(p.cover?'':' none')+'">'+pic+(p.model?'<span class="tag3d">Interactive 3D</span>':'')+'</div></a>';
  });
  var h=feed?'<div class="feed">'+feed+'</div>':'<section class="index"><div class="empty up">No projects found</div></section>';
  document.getElementById('list').innerHTML=h;
  setupAnim();
}
qEl.addEventListener('input',function(){
  if(!document.getElementById('list')){location.hash='#/';return}
  renderList();
});

/* ===== Halaman proyek ===== */
function project(i){
  var p=PROJECTS[i],next=PROJECTS[(i+1)%PROJECTS.length];
  document.title=p.title+' · SAC';
  catsEl.innerHTML=catsHtml(p.year||'-');
  var info='';[['Client',p.client],['Architect',p.architect],['Size m²',p.size],['Typology',p.type],['Status',p.status]].forEach(function(m){if(m[1])info+='<dt>'+m[0]+'</dt><dd>'+esc(m[1])+'</dd>'});
  // foto utama di atas; 3D hanya dimuat saat tombol diklik
  var top=p.cover?'<div class="herop"><img src="'+esc(p.cover)+'" alt="'+esc(p.title)+'"></div>':(p.model?'':'<div class="hero-ph up">Images coming soon</div>');
  var gal=(p.gallery||[]).map(function(s,k){return '<div class="rv" data-k="'+k+'"><img loading="lazy" src="'+esc(s)+'" alt="'+esc(p.title)+'"></div>'}).join('');
  var desc=(p.text_en||p.text_id)?'<div class="desc rv">'+(p.text_en?'<div><div class="lg">EN</div><p>'+esc(p.text_en)+'</p></div>':'')+(p.text_id?'<div class="id"><div class="lg">ID</div><p>'+esc(p.text_id)+'</p></div>':'')+'</div>':'';
  var v3=p.model?'<div class="v3 rv"><div class="viewer" id="v"><div class="vgo"><button class="gate">Explore 3D</button><span class="vt">Interactive model · lights on / off</span></div></div></div>':'';
  app.innerHTML='<div class="pg"><div class="side"><span class="badge">'+two(i+1)+'</span><h1 class="t">'+esc(p.title)+'</h1>'+(p.location?'<span class="loc up">'+esc(p.location)+'</span>':'')+
    (p.year?'<span class="yr">'+esc(p.year)+'</span>':'')+(info?'<dl class="info up">'+info+'</dl>':'')+'</div>'+
    '<div class="body"><div class="viewer-wrap">'+top+'</div>'+desc+(p.text?'<p class="rv">'+esc(p.text)+'</p>':'')+
    (gal?'<div class="gal">'+gal+'</div>':'')+v3+'<div class="rv" style="margin-top:40px">'+ctaHtml()+
    '<div class="nav2"><a href="#/">All projects</a><a href="#/p/'+next.slug+'">Next: '+esc(next.title)+'</a></div></div></div></div>';
  var g=app.querySelector('.gal');if(g)g.onclick=function(e){var d=e.target.closest('[data-k]');if(d)openLb(p.gallery,+d.getAttribute('data-k'))};
  if(p.model)app.querySelector('.vgo .gate').onclick=function(){destroyViewer=mountViewer(document.getElementById('v'),p.model)};
  var hero=app.querySelector('.herop img');
  if(zoomFrom&&hero)zoomTo(hero);
  zoomFrom=null;
  setupAnim();
}

/* ===== Lihat foto galeri ukuran besar ===== */
var lb,lbList,lbI;
function openLb(list,i){
  if(!lb){lb=document.createElement('div');lb.id='lb';lb.innerHTML='<img alt=""><button class="pv" aria-label="Previous">‹</button><button class="nx" aria-label="Next">›</button>';document.body.appendChild(lb);
    lb.onclick=function(e){var b=e.target.closest('button');if(b){lbI=(lbI+(b.className==='nx'?1:-1)+lbList.length)%lbList.length;lb.firstChild.src=lbList[lbI]}else lb.classList.remove('on')};
    document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');else if(e.key==='ArrowRight')lb.querySelector('.nx').click();else if(e.key==='ArrowLeft')lb.querySelector('.pv').click()})}
  lbList=list;lbI=i;lb.firstChild.src=list[i];lb.classList.add('on');
}

/* ===== Zoom halus: foto di beranda membesar ke posisi di halaman detail ===== */
var zoomFrom=null;
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a.item');
  if(!a||reduce||e.metaKey||e.ctrlKey||e.shiftKey)return;
  var im=a.querySelector('.img img.ok');
  zoomFrom=im?{src:im.currentSrc||im.src,pos:im.style.objectPosition,r:im.parentNode.getBoundingClientRect()}:null;
});
function zoomTo(hero){
  var f=zoomFrom;
  hero.style.animation='none';hero.style.visibility='hidden';
  function go(){
    var r=hero.getBoundingClientRect();
    if(!r.width){hero.style.visibility='';return}
    var c=document.createElement('img');c.src=f.src;
    c.style.cssText='position:fixed;z-index:50;margin:0;object-fit:cover;pointer-events:none;object-position:'+(f.pos||'50% 50%');
    document.body.appendChild(c);
    var A={left:f.r.left+'px',top:f.r.top+'px',width:f.r.width+'px',height:f.r.height+'px'},
        B={left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'};
    var an=c.animate([A,B],{duration:850,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'});
    an.onfinish=function(){hero.style.visibility='';c.remove()};
  }
  // tunggu halaman sudah di-scroll ke atas dan foto siap
  requestAnimationFrame(function(){if(hero.complete&&hero.naturalWidth)go();else hero.onload=go});
}

/* ===== Animasi muncul saat scroll ===== */
var io=null,lastY=0;
if(!reduce)document.documentElement.classList.add('anim');
function setupAnim(){
  var els=[].slice.call(document.querySelectorAll('.rv:not(.in)'));
  if(io)io.disconnect();
  if(reduce||!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08,rootMargin:'0px 0px -4% 0px'});
  els.forEach(function(e){io.observe(e)});
  collectPx();
}

/* ===== Gerak halus saat scroll (parallax) ===== */
var px=[],pxRaf=0;
function collectPx(){
  px=[].slice.call(document.querySelectorAll('.item')).map(function(el){return {el:el,box:el.querySelector('.img'),img:el.querySelector('.img img'),lbl:el.querySelector('.lbl'),cur:0}});
  kickPx();
}
function kickPx(){if(!pxRaf&&!reduce&&px.length)pxRaf=requestAnimationFrame(tickPx)}
function tickPx(){
  pxRaf=0;var vh=window.innerHeight,moving=false;
  px.forEach(function(o){
    var r=o.el.getBoundingClientRect();
    if(r.bottom<-200||r.top>vh+200)return;
    // posisi foto terhadap tengah layar: -1 (atas) sampai 1 (bawah)
    var t=Math.max(-1,Math.min(1,(r.top+r.height/2-vh/2)/(vh/2+r.height/2)));
    o.cur+=(t-o.cur)*0.1; // diperhalus supaya gerakan tidak patah-patah
    if(Math.abs(t-o.cur)>0.0005)moving=true;
    if(o.img)o.img.style.translate='0 '+(-o.cur*o.box.offsetHeight*0.07).toFixed(2)+'px';
    o.lbl.style.translate='0 '+(-o.cur*16).toFixed(2)+'px';
  });
  if(moving)kickPx();
}
var topbar=document.querySelector('.top');
window.addEventListener('scroll',function(){
  var y=window.pageYOffset;
  topbar.classList.toggle('hide',y>140&&y>lastY);lastY=y;
  kickPx();
},{passive:true});
window.addEventListener('resize',kickPx);

/* ===== Rute halaman ===== */
function route(){
  if(destroyViewer){destroyViewer();destroyViewer=null}
  var h=location.hash,m=h.match(/^#\/p\/([^\/]+)/),y=h.match(/^#\/y\/(\d+)/),idx=-1;
  if(m)PROJECTS.forEach(function(p,i){if(p.slug===m[1])idx=i});
  if(idx>=0){project(idx);window.scrollTo(0,0)}
  else{
    var sameHome=!!document.getElementById('list')&&(h==='#about'||h==='#contact');
    if(!sameHome)home(y?y[1]:'');
    var t=(h==='#about'||h==='#contact')?document.getElementById(h.slice(1)):null;
    if(t)t.scrollIntoView();else window.scrollTo(0,0);
  }
  topbar.classList.remove('hide');
}
window.addEventListener('hashchange',route);route();

/* ============ 3D viewer ============ */
var libsP;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadLibs(){
  if(libsP)return libsP;
  var L=['https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js','https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'];
  libsP=L.reduce(function(p,u){return p.then(function(){return loadScript(u)})},Promise.resolve()).catch(function(e){libsP=null;throw e});
  return libsP;
}
function mountViewer(box,url){
  var dead=false,renderer=null,ro=null,scene=null;
  box.innerHTML='<div class="vload"><div class="vt">Loading 3D model…</div><div class="track"><div class="fill"></div></div></div>'+
   '<div class="vgate"><button class="gate">Explore in 3D</button></div>'+
   '<div class="vviews"></div><div class="vbar"><button data-a="rot" aria-pressed="false">Auto-rotate</button><button data-a="night" aria-pressed="false">Lights on</button><button data-a="reset">Reset</button><button data-a="fs">Fullscreen</button></div>';
  var load=box.querySelector('.vload'),vt=box.querySelector('.vt'),fill=box.querySelector('.fill'),gate=box.querySelector('.vgate'),vv=box.querySelector('.vviews'),bar=box.querySelector('.vbar');
  function fail(){vt.textContent='The 3D model could not be loaded.';fill.style.background='#b3261e'}
  loadLibs().then(function(){
    if(dead)return;
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
    box.insertBefore(renderer.domElement,box.firstChild);
    scene=new THREE.Scene();
    // cahaya lingkungan lembut (pantulan & bounce light)
    var pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new THREE.RoomEnvironment(),0.04).texture;pm.dispose();
    var camera=new THREE.PerspectiveCamera(45,1,1,10000);
    var hemi=new THREE.HemisphereLight(0xffffff,0x8a8576,0.35),sun=new THREE.DirectionalLight(0xfff2dc,1.6);
    sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.02;sun.shadow.radius=4;
    scene.add(hemi);scene.add(sun);scene.add(sun.target);var mats=[];
    var controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.dampingFactor=0.08;controls.autoRotateSpeed=0.6;
    var home={pos:new THREE.Vector3(),target:new THREE.Vector3()},night=false,fly=null,glow=[],bulbs=[];
    function flyTo(a){var from=camera.position.clone(),to=new THREE.Vector3(a[0],a[1],a[2]),t0=performance.now();fly=function(){var k=Math.min(1,(performance.now()-t0)/800),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(from,to,e);controls.target.copy(home.target);if(k>=1)fly=null}}
    function setActive(a){controls.enabled=a;renderer.domElement.style.touchAction=a?'none':'pan-y';gate.style.display=a?'none':'flex';bar.style.display='flex'}
    function resize(){var w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(box)}else window.addEventListener('resize',resize);
    resize();
    function ok(g){
      if(dead)return;
      scene.add(g.scene);
      var b=new THREE.Box3().setFromObject(g.scene),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z);
      camera.near=r/500;camera.far=r*30;camera.updateProjectionMatrix();
      home.target.copy(c);home.pos.set(c.x-r*1.4,c.y+r*0.05,c.z);
      camera.position.copy(home.pos);controls.target.copy(c);
      controls.minDistance=r*0.05;controls.maxDistance=r*4;controls.maxPolarAngle=Math.PI*0.495;
      sun.position.set(c.x+r*0.25,c.y+r*1.5,c.z+r*0.35);sun.target.position.copy(c);controls.update();
      var sc=sun.shadow.camera;sc.left=sc.bottom=-r*0.75;sc.right=sc.top=r*0.75;sc.near=r*0.1;sc.far=r*4;sc.updateProjectionMatrix();
      // material SketchUp (specular-glossiness) diganti material matte standar
      var conv=new Map();
      function std(x){if(conv.has(x))return conv.get(x);var glass=x.opacity<0.95;
        var n=new THREE.MeshStandardMaterial({color:x.color,map:x.map,roughness:glass?0.1:0.8,metalness:0,transparent:glass,opacity:glass?x.opacity:1,depthWrite:!glass,alphaTest:(!glass&&x.transparent)?0.5:x.alphaTest,side:x.side});n.name=x.name;conv.set(x,n);mats.push(n);return n}
      g.scene.traverse(function(m){if(m.isMesh){m.material=Array.isArray(m.material)?m.material.map(std):std(m.material);
        // plafon/atap tipis lebar di bagian atas tidak memberi bayangan, supaya cahaya dari atas masuk ke interior
        var mb=new THREE.Box3().setFromObject(m),ms=mb.getSize(new THREE.Vector3());
        var roof=ms.y<r*0.03&&ms.x*ms.z>r*r*0.04&&mb.min.y>c.y;
        m.castShadow=!roof&&!(m.material.opacity<1);m.receiveShadow=true}});
      renderer.shadowMap.needsUpdate=true;
      // lampu: objek bernama LAMPU di SketchUp
      var lamps=[];g.scene.traverse(function(o){if(/lampu/i.test(o.name||'')&&!(o.parent&&/lampu/i.test(o.parent.name||'')))lamps.push(o)});
      lamps.forEach(function(o){o.traverse(function(m){if(m.isMesh){m.material=[].concat(m.material).map(function(x){x=x.clone();x.userData.e0=x.emissive?x.emissive.getHex():0;glow.push(x);return x});if(m.material.length===1)m.material=m.material[0]}})});
      var step=Math.max(1,Math.ceil(lamps.length/16));
      for(var i=0;i<lamps.length;i+=step){var pl=new THREE.PointLight(0xffc98a,0,r*0.3,2);new THREE.Box3().setFromObject(lamps[i]).getCenter(pl.position);pl.position.y-=r*0.01;scene.add(pl);bulbs.push(pl)}
      var V={Corner:[c.x+r*.75,c.y+r*.55,c.z+r*.75],Front:[c.x,c.y+r*.22,c.z+r*.95],Side:[c.x+r*.95,c.y+r*.22,c.z],Aerial:[c.x+r*.35,c.y+r*1.0,c.z+r*.55],Plan:[c.x,c.y+r*1.25,c.z+r*.001]};
      vv.innerHTML=Object.keys(V).map(function(k){return '<button data-v="'+k+'">'+k+'</button>'}).join('');
      vv.onclick=function(e){var b=e.target.closest('button');if(b)flyTo(V[b.getAttribute('data-v')])};
      setActive(true);load.style.opacity=0;setTimeout(function(){load.style.display='none'},500);
    }
    box.querySelector('.gate').onclick=function(){setActive(true)};
    bar.onclick=function(e){
      var t=e.target.closest('button');if(!t)return;var a=t.getAttribute('data-a');
      if(a==='rot'){controls.autoRotate=!controls.autoRotate;t.setAttribute('aria-pressed',controls.autoRotate)}
      else if(a==='night'){night=!night;t.setAttribute('aria-pressed',night);t.textContent=night?'Lights off':'Lights on';
        renderer.setClearColor(night?0x0d1018:0x000000,night?1:0);hemi.intensity=night?0.12:0.35;sun.intensity=night?0.05:1.6;
        mats.forEach(function(m){m.envMapIntensity=night?0.12:1});sun.color.setHex(night?0x8fa6d9:0xfff2dc);
        bulbs.forEach(function(l){l.intensity=night?1.6:0});
        glow.forEach(function(m){if(m.emissive){m.emissive.setHex(night?0xffd29a:m.userData.e0);m.emissiveIntensity=night?1.2:1}})}
      else if(a==='reset'){camera.position.copy(home.pos);controls.target.copy(home.target);controls.update()}
      else if(a==='lock'){setActive(false)}
      else if(a==='fs'){var d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var f=box.requestFullscreen||box.webkitRequestFullscreen;if(f)f.call(box);setActive(true)}}
    };
    renderer.setAnimationLoop(function(){if(fly)fly();controls.update();renderer.render(scene,camera)});
    var x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';
    x.onprogress=function(e){if(e.lengthComputable)fill.style.width=(e.loaded/e.total*70)+'%'};
    x.onerror=fail;
    x.onload=function(){
      if(dead)return;if(x.status>=400){fail();return}
      try{
        var buf=x.response,u8=new Uint8Array(buf);
        if(u8[0]===0x1f&&u8[1]===0x8b){var o=pako.ungzip(u8);buf=o.buffer.slice(o.byteOffset,o.byteOffset+o.byteLength)}
        fill.style.width='85%';vt.textContent='Preparing the scene…';
        setTimeout(function(){if(!dead)new THREE.GLTFLoader().parse(buf,'',ok,fail)},30);
      }catch(e){fail()}
    };
    x.send();
  }).catch(fail);
  return function(){
    dead=true;if(ro)ro.disconnect();
    if(scene)scene.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(function(m){for(var k in m){if(m[k]&&m[k].isTexture)m[k].dispose()}m.dispose()})}});
    if(renderer){renderer.setAnimationLoop(null);renderer.dispose()}
  };
}
